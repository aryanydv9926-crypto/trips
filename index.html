<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JourneyJar — Midnight Gold Travel Planning &amp; Budget Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="JourneyJar: Luxury travel planning, AI budget allocation, curated destination cinema, split expenses, and secure travel vault.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23070D18'/%3E%3Cpath d='M8 30L17 14l6 9 5-7 6 14z' fill='%23F5B942'/%3E%3Ccircle cx='28' cy='12' r='3.5' fill='%23FFD166'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Firebase (modular v10): initialised once in firebase-init.js, configured in firebase-config.js -->
  <script type="module" src="firebase-init.js"></script>
</head>
<body>
  <!-- Auth Modal -->
  <div id="au" onkeydown="if(event.keyCode==13)sub()">
    <div class="ac" id="ab">
      <div style="text-align:center;padding:30px"><span class="sp"></span></div>
    </div>
  </div>

  <!-- Print Container -->
  <div id="pr"></div>

  <!-- Top Navigation Header -->
  <header id="nb">
    <div class="lgo" onclick="nv(0)" title="JourneyJar Home">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-label="JourneyJar Logo">
        <rect x="3" y="3" width="34" height="34" rx="10" fill="#0D1726" stroke="#F5B942" stroke-width="1.5"/>
        <path d="M8 30L17 14l6 9 5-7 6 14z" fill="#F5B942"/>
        <circle cx="28" cy="12" r="3.5" fill="#FFD166"/>
      </svg>
      <span>JourneyJar</span>
    </div>
    <nav id="nl">
      <a onclick="nv(0)">Home</a>
      <a onclick="nv(1)">Trips</a>
      <a onclick="nv(2)">Explore</a>
      <a onclick="nv(3)">About</a>
      <a onclick="nv(4)">Help</a>
    </nav>
    <button class="btn g s mb" onclick="nm()" title="Menu"><i data-lucide="menu"></i></button>
    <button class="btn g s" onclick="tg()" title="Toggle Theme"><i data-lucide="sun-moon"></i></button>
    <button class="btn s" onclick="nv(5)" title="Settings &amp; Profile"><i data-lucide="user"></i></button>
    <button class="btn g s" onclick="logout()" title="Log out"><i data-lucide="log-out"></i></button>
  </header>

  <!-- App Main Layout -->
  <div id="app">
    <!-- Sidebar Navigation -->
    <aside>
      <div class="lg">
        <svg width="34" height="34" viewBox="0 0 40 40">
          <rect x="3" y="3" width="34" height="34" rx="10" fill="#0D1726" stroke="#F5B942" stroke-width="1.5"/>
          <path d="M8 30L17 14l6 9 5-7 6 14z" fill="#F5B942"/>
          <circle cx="28" cy="12" r="3.5" fill="#FFD166"/>
        </svg>
        <span class="nl">JourneyJar</span>
      </div>
      <p class="tg">Every Journey, Within Your Budget</p>
      <nav id="nav"></nav>
    </aside>

    <!-- Main Content Area -->
    <div id="mn">
      <div class="top">
        <button class="btn g s" onclick="$('#app').classList.toggle('c')" title="Toggle sidebar">
          <i data-lucide="panel-left"></i>
        </button>
        <h1 id="ttl"></h1>
        <select id="ts" style="width:auto;max-width:240px" onchange="V.trip=this.value;R()"></select>
        <button class="btn o" onclick="wiz()">
          <i data-lucide="plus"></i>Plan a New Journey
        </button>
      </div>
      <div id="pg"></div>
    </div>
  </div>

  <!-- Shared Modal & Notification Toast -->
  <div id="ov"><div id="m"></div></div>
  <div id="t"></div>

  <script src="services/tmdb.js"></script>
  <script src="services/opentripmap.js"></script>
  <script src="script.js"></script>
  <script src="discovery-ui.js"></script>
  <script src="trip-sync.js"></script>
  <script src="travel-vault.js"></script>
</body>
</html>
